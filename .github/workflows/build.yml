name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'V*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: AudioNormalizer-linux
            executable_path: dist/AudioNormalizer
            asset_name: AudioNormalizer-linux
          - os: windows-latest
            artifact_name: AudioNormalizer-windows
            executable_path: dist/AudioNormalizer.exe
            asset_name: AudioNormalizer-windows.exe
          - os: macos-latest
            artifact_name: AudioNormalizer-macos
            executable_path: dist/AudioNormalizer
            asset_name: AudioNormalizer-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libegl1/libgl1 zusaetzlich zu den xcb-Paketen: ohne sie scheitert schon
          # "import PyQt6.QtWidgets", womit die GUI-Tests hier nie liefen.
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0 libegl1 libgl1

      - name: Run tests
        run: |
          python -m pytest

      - name: Build with PyInstaller
        run: |
          pyinstaller AudioNormalizer.spec

      - name: Rename executable for release
        shell: bash
        run: |
          cp "${{ matrix.executable_path }}" "${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.asset_name }}
          fail_on_unmatched_files: true
