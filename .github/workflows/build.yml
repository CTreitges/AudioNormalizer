name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm64, windows-latest, macos-13, macos-14]
        include:
          - os: ubuntu-latest
            artifact_name: AudioNormalizer-linux-x64
            executable_path: dist/AudioNormalizer
          - os: ubuntu-24.04-arm64
            artifact_name: AudioNormalizer-linux-arm64
            executable_path: dist/AudioNormalizer
          - os: windows-latest
            artifact_name: AudioNormalizer-windows
            executable_path: dist/AudioNormalizer.exe
          - os: macos-13
            artifact_name: AudioNormalizer-macos-intel
            executable_path: dist/AudioNormalizer
          - os: macos-14
            artifact_name: AudioNormalizer-macos-arm64
            executable_path: dist/AudioNormalizer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0

      - name: Build with PyInstaller
        run: |
          pyinstaller AudioNormalizer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable_path }}
